name: Measurement Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  controlled-observation-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile measurement scripts
        run: |
          python -m py_compile scripts/controlled-observation-analyzer.py
          python -m py_compile scripts/benchmark-analyzer.py
          python -m py_compile scripts/health-snapshot-observation.py
          python -m py_compile scripts/descriptive-evaluation-report.py
          python -m py_compile scripts/experiment-protocol.py
          python -m py_compile scripts/controlled-experiment-runner.py
          python -m py_compile scripts/evidence_measurement.py
          python -m py_compile scripts/offline_evaluation.py
      - name: Run controlled observation analyzer tests
        run: python tests/controlled_observation_analyzer_test.py
      - name: Run evidence measurement tests
        run: python tests/evidence_measurement_test.py
      - name: Run offline evaluation tests
        run: python tests/offline_evaluation_test.py
      - name: Run offline evaluation fixture
        run: |
          python scripts/offline_evaluation.py \
            cloud/evaluation/example-offline-evaluation-dataset.json \
            --rules benchmarks/evidence_rules.json \
            --out /tmp/offline-evaluation.json \
            --history /tmp/offline-evaluation-history.jsonl
          python -c "import json; d=json.load(open('/tmp/offline-evaluation.json')); assert d['caseCount']==2; assert d['classificationCounts']['NO_REGRESSION']==1; assert d['classificationCounts']['INSUFFICIENT_EVIDENCE']==1; assert d['executionAllowed'] is False; assert d['policySelectionAllowed'] is False"
      - name: Run benchmark analyzer tests
        run: |
          if [ -f tests/benchmark_analyzer_test.py ]; then
            python tests/benchmark_analyzer_test.py
          else
            echo "No benchmark_analyzer_test.py present; skipping."
          fi
      - name: Run health snapshot observation tests
        run: python tests/health_snapshot_observation_test.py
      - name: Run descriptive evaluation report tests
        run: python tests/descriptive_evaluation_report_test.py
      - name: Run Stage 2 experiment protocol tests
        run: python tests/experiment_protocol_test.py
      - name: Run Stage 2 controlled experiment runner tests
        run: python tests/controlled_experiment_runner_test.py
