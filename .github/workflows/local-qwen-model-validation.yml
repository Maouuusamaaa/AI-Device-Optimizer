name: Local Qwen Model Adapter Validation

on:
  push:
    branches:
      - main
      - feat/stage7-qwen3-local-model-adapter
    paths:
      - 'android/local-ai/**'
      - 'tests/qwen_local_model_adapter_test.py'
      - '.github/workflows/local-qwen-model-validation.yml'
  pull_request:
    paths:
      - 'android/local-ai/**'
      - 'tests/qwen_local_model_adapter_test.py'
      - '.github/workflows/local-qwen-model-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile adapter
        run: python3 -m py_compile android/local-ai/llama-adapter.py android/local-ai/benchmark-llama.py
      - name: Run adapter safety test
        run: python3 tests/qwen_local_model_adapter_test.py
      - name: Validate model manifest
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("android/local-ai/model-manifest.json"))
          assert p["runtime"] == "llama.cpp"
          assert p["targetAbi"] == "arm64-v8a"
          assert p["repositoryMustNotContainModelBinary"] is True
          assert p["advisoryOnly"] is True
          assert p["deviceMutationAllowed"] is False
          print("Qwen model manifest valid")
          PY
