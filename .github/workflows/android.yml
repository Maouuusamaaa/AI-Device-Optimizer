name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Validate Termux/Rish benchmark script
        run: bash -n ../scripts/rish-baseline.sh

      - name: Validate benchmark analyzer
        run: python3 -m py_compile ../scripts/benchmark-analyzer.py

      - name: Run benchmark analyzer tests
        run: python3 ../scripts/test-benchmark-analyzer.py

      - name: Validate benchmark evaluator
        run: python3 -m py_compile ../benchmarks/evaluator.py

      - name: Run benchmark evaluator tests
        run: python3 ../scripts/test-benchmark-evaluator.py

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-device-optimizer-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
