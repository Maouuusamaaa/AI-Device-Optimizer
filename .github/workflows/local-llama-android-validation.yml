name: Local Llama Android Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "tests/stage8_android_runtime_contract_test.py"
      - "docs/STAGE8_ANDROID_LLAMA_RUNTIME.md"
      - "docs/STAGE9_REAL_DEVICE_INFERENCE_BENCHMARK.md"
      - "tests/stage9_local_inference_benchmark_contract_test.py"
      - "tests/stage9_benchmark_analyzer_test.py"
      - ".github/workflows/local-llama-android-validation.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "android/**"
      - "tests/stage8_android_runtime_contract_test.py"
      - "docs/STAGE8_ANDROID_LLAMA_RUNTIME.md"
      - ".github/workflows/local-llama-android-validation.yml"

jobs:
  android-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Verify runtime contract
        run: |
          test -f android/app/src/main/cpp/CMakeLists.txt
          grep -q 'b10982' android/app/src/main/cpp/CMakeLists.txt
          grep -q 'GGML_NATIVE OFF' android/app/src/main/cpp/CMakeLists.txt
          grep -q 'LLAMA_OPENSSL OFF' android/app/src/main/cpp/CMakeLists.txt
          grep -q 'deviceMutationAllowed' android/app/src/main/cpp/local_ai_runtime.cpp
          if find . -type f -name "*.gguf" | grep -q .; then
            echo "GGUF binaries must not be committed."
            exit 1
          fi

      - name: Prepare stable CI signing key
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_B64" || { echo "Missing ANDROID_SIGNING_KEYSTORE_B64"; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD" || { echo "Missing ANDROID_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_ALIAS" || { echo "Missing ANDROID_SIGNING_KEY_ALIAS"; exit 1; }
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["ANDROID_SIGNING_KEYSTORE_B64"]
          normalized = "".join(raw.split())
          if not re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", normalized):
              raise SystemExit("ANDROID_SIGNING_KEYSTORE_B64 contains non-base64 characters after whitespace normalization.")
          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              raise SystemExit(f"ANDROID_SIGNING_KEYSTORE_B64 is not valid base64: {exc}")
          if not decoded:
              raise SystemExit("Decoded signing keystore is empty.")
          Path(os.environ["RUNNER_TEMP"], "ai-device-optimizer-ci.jks").write_bytes(decoded)
          print(f"Decoded stable signing keystore bytes: {len(decoded)}")
          PY
          test -s "$RUNNER_TEMP/ai-device-optimizer-ci.jks"
          keytool -list -keystore "$RUNNER_TEMP/ai-device-optimizer-ci.jks" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore "$RUNNER_TEMP/ai-device-optimizer-ci.jks" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" -rfc >/dev/null
          echo "Stable PKCS12 signing keystore, store password, and alias validated."

      - name: Run Stage 8 contract test
        run: |
          python3 tests/stage8_android_runtime_contract_test.py

      - name: Run Stage 9 benchmark contract test
        run: |
          python3 tests/stage9_local_inference_benchmark_contract_test.py
          python3 tests/stage9_benchmark_analyzer_test.py

      - name: Build debug APK and unit tests
        working-directory: android
        env:
          CI_ANDROID_KEYSTORE_FILE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && format('{0}/ai-device-optimizer-ci.jks', runner.temp) || '' }}
          CI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          # PKCS12 private-key entries use the keystore password for Android Gradle signing.
          CI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Verify native library in APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(ai_local_runtime|llama|ggml).*\.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libai_local_runtime.so'

      - name: Verify stable APK signature
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_CERT_SHA256="DC:50:BF:33:B5:7B:DA:E1:F8:00:B5:23:5B:18:E3:A0:3F:BE:FA:54:F1:EA:25:99:67:0B:86:E7:22:E9:C4:F9"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-cert.txt"
          ACTUAL_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$RUNNER_TEMP/apksigner-cert.txt" | tr -d ':')"
          EXPECTED_CERT_SHA256_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256_NORMALIZED"

      - name: Upload stable debug APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ai-device-optimizer-stage9-stable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Stable main build trigger: produces the signed APK artifact after successful validation.
