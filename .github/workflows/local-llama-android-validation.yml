name: Local Llama Android Validation

on:
  pull_request:
    paths:
      - "android/**"
      - "tests/stage8_android_runtime_contract_test.py"
      - "docs/STAGE8_ANDROID_LLAMA_RUNTIME.md"
      - ".github/workflows/local-llama-android-validation.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "android/**"
      - "tests/stage8_android_runtime_contract_test.py"
      - "docs/STAGE8_ANDROID_LLAMA_RUNTIME.md"
      - ".github/workflows/local-llama-android-validation.yml"

jobs:
  android-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Verify runtime contract
        run: |
          test -f android/app/src/main/cpp/CMakeLists.txt
          grep -q 'b10982' android/app/src/main/cpp/CMakeLists.txt
          grep -q 'GGML_NATIVE OFF' android/app/src/main/cpp/CMakeLists.txt
          grep -q 'LLAMA_OPENSSL OFF' android/app/src/main/cpp/CMakeLists.txt
          grep -q 'deviceMutationAllowed' android/app/src/main/cpp/local_ai_runtime.cpp
          if find . -type f -name "*.gguf" | grep -q .; then
            echo "GGUF binaries must not be committed."
            exit 1
          fi

      - name: Prepare stable CI signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_B64" || { echo "Missing ANDROID_SIGNING_KEYSTORE_B64"; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD" || { echo "Missing ANDROID_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_ALIAS" || { echo "Missing ANDROID_SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_PASSWORD" || { echo "Missing ANDROID_SIGNING_KEY_PASSWORD"; exit 1; }
          echo "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ai-device-optimizer-ci.jks"
          test -s "$RUNNER_TEMP/ai-device-optimizer-ci.jks"
          keytool -list -keystore "$RUNNER_TEMP/ai-device-optimizer-ci.jks" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore "$RUNNER_TEMP/ai-device-optimizer-ci.jks" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" -keypass "$ANDROID_SIGNING_KEY_PASSWORD" -rfc >/dev/null
          echo "Stable signing keystore, store password, alias, and key password validated."

      - name: Run Stage 8 contract test
        run: |
          python3 tests/stage8_android_runtime_contract_test.py

      - name: Build debug APK and unit tests
        working-directory: android
        env:
          CI_ANDROID_KEYSTORE_FILE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/ai-device-optimizer-ci.jks', runner.temp) || '' }}
          CI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify native library in APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(ai_local_runtime|llama|ggml).*\.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libai_local_runtime.so'

      - name: Verify stable APK signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload stable debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ai-device-optimizer-stage8-stable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
